---
name: Run tests

on:
  push:

permissions:
  contents: read

jobs:
 tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22 # v3.5.0

      - name: Set up python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v4.5.0
        with:
          python-version: '3.12'

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install .[test]

      - name: Run python tests
        run: |
          pytest test --random-order --random-order-bucket=global --cov --cov-report=xml

